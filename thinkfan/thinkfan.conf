###############################################################################
# thinkfan configuration for Lenovo ThinkPad T490s
#
# This configuration is based on the actual sensors detected on this machine
# and follows best practices for ThinkPad laptops:
#  - Use stable hwmon paths (name-based lookup)
#  - Prefer coretemp (CPU package) as the main control signal
#  - Use thinkpad-isa sensor only as an auxiliary (optional)
#  - Control the fan via thinkpad_acpi (tpacpi)
#  - Use SIMPLE mode (one temperature decision for all sensors)
#
# IMPORTANT:
# Do NOT copy configs blindly between ThinkPads.
# This file is tailored specifically for the T490s with Intel i5-8265U.
###############################################################################


###############################################################################
# SENSORS
#
# The order of sensors matters.
# In SIMPLE mode, thinkfan will look at ALL configured sensors and
# use the HIGHEST temperature to decide the fan level.
#
# Rule of thumb for laptops:
#  - Fewer sensors = more predictable behavior
###############################################################################
sensors:

  ###########################################################################
  # CPU temperature (MAIN sensor)
  #
  # Source: coretemp driver
  # Corresponds to "Package id 0" from `sensors`
  #
  # This is the real CPU die temperature and should always be present.
  # It reacts quickly to load changes and is the most reliable signal.
  ###########################################################################
  - hwmon: /sys/class/hwmon
    name: coretemp
    indices: [1]

  ###########################################################################
  # ThinkPad Embedded Controller (EC) temperature (AUXILIARY)
  #
  # Source: thinkpad-isa-0000, field "CPU"
  #
  # This is NOT the same as the CPU die temperature.
  # On many ThinkPads it tends to stay around ~50°C and cools down slowly,
  # which can prevent the fan from turning off.
  #
  # Marked as optional so thinkfan will not fail if it disappears.
  # If you experience the fan never turning off at idle,
  # REMOVE this sensor entirely.
  ###########################################################################
  - chip: thinkpad-isa-0000
    ids: [ CPU ]
    optional: true

  ###########################################################################
  # NVMe SSD temperature (OPTIONAL)
  #
  # Source: nvme-pci-* "Composite" temperature
  #
  # Useful to avoid SSD overheating during long sustained loads
  # (builds, compiles, I/O-heavy workloads).
  #
  # Optional because the system must still work without an NVMe drive.
  ###########################################################################
  - hwmon: /sys/class/hwmon
    name: nvme
    indices: [1]
    optional: true


###############################################################################
# FAN DRIVER
#
# ThinkPads use the thinkpad_acpi interface.
# This allows discrete fan levels (0–7), "auto", and "disengaged".
#
# fan_control=1 must be enabled in thinkpad_acpi for this to work.
###############################################################################
fans:
  - tpacpi: /proc/acpi/ibm/fan


###############################################################################
# FAN LEVELS — SIMPLE MODE
#
# Format:
#   [FAN_LEVEL, LOWER_TEMP, UPPER_TEMP]
#
# - Temperatures are in °C
# - The highest temperature among all sensors is used
# - Fan levels correspond to ThinkPad firmware levels
#
# Design goals for this curve:
#  - Fan completely OFF at idle
#  - Smooth, progressive ramp-up
#  - No sudden jumps in noise
#  - Hard thermal protection at high temperatures
###############################################################################
levels:
  - [0, 0, 50]

  - [1, 48, 55]
  - [2, 53, 60]
  - [3, 58, 65]

  - [4, 63, 70]
  - [5, 68, 75]

  - [6, 73, 80]
  - [7, 78, 85]

  - ["level disengaged", 83, 255]


###############################################################################
# NOTES / TROUBLESHOOTING
#
# - If the fan never turns off at idle:
#     Remove the thinkpad-isa sensor block entirely.
#
# - If temperatures spike too fast:
#     Lower the first thresholds slightly (e.g. 47 → 45).
#
# - If the fan is too noisy:
#     Increase the lower limits or reduce the number of mid levels.
#
# Always test with:
#   sudo thinkfan -n
#   watch -n1 cat /proc/acpi/ibm/fan
###############################################################################

