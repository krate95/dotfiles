background {
    monitor =
    path =
    color = rgb(1e2030)
    blur_passes = 3
    blur_size = 8
}

label {
    monitor =
    text = Welcome back $USER
    color = rgba(200, 200, 200, 1.0)
    font_size = 25
    font_family = CaskaydiaCove Nerd Font

    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgba(200, 200, 200, 1.0)
    font_size = 40
    font_family = CaskaydiaCove Nerd Font

    position = 0, 300
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 200, 50
    outline_thickness = 3
    dots_size = 0.33
    dots_spacing = 0.15
    inner_color = rgb(200, 200, 200)
    font_color = rgb(10, 10, 10)
    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    hide_input = false
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $FPRINTPROMPT $FPRINTFAIL
    color = rgba(200, 200, 200, 1.0)
    font_size = 14
    font_family = CaskaydiaCove Nerd Font

    position = 0, -80
    halign = center
    valign = center
}

auth {
    fingerprint:enabled = true
    fingerprint:ready_message =
    fingerprint:present_message = 󰈷 Scanning...
}
